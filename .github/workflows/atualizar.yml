name: Atualizar playlists
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, ~06:17 de Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar playlists
        run: python build.py --out .
      - name: Salvar
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add brasil.m3u completa.m3u resumo.json
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +%F)"
          git push
